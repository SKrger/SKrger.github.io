featured:
  card_label: "IN PROGRESS · DATA ENGINEERING"
  title: "European Economic Data Pipeline"
  summary: "A complete pipeline for collecting, transforming, and analyzing public statistical data from Eurostat."
  description: "The project is a practical way to learn modern data engineering patterns: ingesting external data with dlt, orchestrating jobs with Dagster, modeling with dbt, and presenting results in Streamlit."
  tags:
    - Python
    - Eurostat
    - dlt
    - Dagster
    - dbt
    - Streamlit
  cta:
    label: "View on GitHub"
    url: "https://github.com/SKrger/eurostat_data"
  workflow:
    - Collect public economic indicators
    - Transform and validate the data
    - Orchestrate repeatable runs
    - Make the results explorable

